# =========================================
# 微信及特定小程序去广告规则 (最优、省电、快速版)
# 采用 Rewrite 伪装成功 (Reject-200/dict) 机制
# 避免拦截造成的无限重试耗电，实现零延迟、零发热
# 更新时间: 2026-06-03
# =========================================

# -----------------------------------------
# [MITM] 解析说明
# 开启 opt-parser=true 后，QX 会自动读取以下 hostname 并加入解密列表
# -----------------------------------------
hostname = e.advertising.qq.com, gdt.qq.com, qzs.qq.com, sngpm.qq.com, trace.qq.com, btrace.qq.com, mtrace.qq.com, trace.tencent.com, adsmind.tc.qq.com, pgdt.ptengine.cn, xcslite.tencentcs.com, badjs.weixinbridge.com, mp.weixin.qq.com, info4.video.qq.com, info6.video.qq.com, ios.video.mpush.video.qq.com, livep.l.qq.com, vd.l.qq.com, vi.l.qq.com, api.yidianlingyi.cn, umini.shujupie.com

# -----------------------------------------
# [Rewrite Local] 伪装重写模块
# -----------------------------------------
[rewrite_local]

; ====== 1. 针对特定小程序的第三方广告与追踪精准拦截 ======
; 拦截一点领壹广告下发接口 (兼容开发者双斜杠URL拼写错误，返回空字典防止报错白屏)
^https?:\/\/api\.yidianlingyi\.cn\/.*universalAdQuery url reject-dict
; 拦截数据派/友盟广告曝光上报 (返回200伪装成功，骗过SDK停止后台重试)
^https?:\/\/umini\.shujupie\.com\/wxm_logs url reject-200

; ====== 2. 腾讯核心广告联盟与数据追踪 ======
; 拦截广点通及腾讯广告数据上报
^https?:\/\/(e\.advertising|gdt|qzs|sngpm|trace|btrace|mtrace|trace\.tencent)\.qq\.com url reject-200
^https?:\/\/adsmind\.tc\.qq\.com url reject-200
^https?:\/\/pgdt\.ptengine\.cn url reject-200

; ====== 3. 微信小程序/公众号内的基础数据收集 ======
; 阻止性能与错误上报，减少后台活动
^https?:\/\/xcslite\.tencentcs\.com url reject-dict
^https?:\/\/badjs\.weixinbridge\.com url reject-200
^https?:\/\/mp\.weixin\.qq\.com\/mp\/waerrreport url reject-200

; ====== 4. 腾讯系其他常见弹窗与开屏广告 ======
; 覆盖部分腾讯视频等在微信内调用的广告组件
^https?:\/\/(info4|info6|ios\.video\.mpush)\.video\.qq\.com url reject-200
^https?:\/\/(livep|vd|vi)\.l\.qq\.com url reject-200
