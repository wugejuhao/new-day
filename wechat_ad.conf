# 微信及特定小程序去广告规则 (Reject-200 伪装成功版，极致省电)
# 更新时间: 2026-06-03
# 
# hostname = e.advertising.qq.com, gdt.qq.com, qzs.qq.com, sngpm.qq.com, trace.qq.com, btrace.qq.com, mtrace.qq.com, trace.tencent.qq.com, adsmind.tc.qq.com, xcslite.tencentcs.com, badjs.weixinbridge.com, mp.weixin.qq.com, info4.video.qq.com, info6.video.qq.com, ios.video.mpush.video.qq.com, livep.l.qq.com, vd.l.qq.com, vi.l.qq.com, api.yidianlingyi.cn, umini.shujupie.com

; ====== 1. 针对您当前使用的特定小程序第三方广告 (抓包精准打击) ======
; 拦截一点领壹广告下发接口 (返回空字典，防止界面报错)
^https?:\/\/api\.yidianlingyi\.cn\/.*\/universalAdQuery url reject-dict
; 拦截数据派/友盟广告曝光上报 (返回200，骗过SDK停止重试)
^https?:\/\/umini\.shujupie\.com\/wxm_logs url reject-200

; ====== 2. 腾讯核心广告联盟与数据追踪 ======
^https?:\/\/(e\.advertising|gdt|qzs|sngpm|trace|btrace|mtrace|trace\.tencent)\.qq\.com url reject-200
^https?:\/\/adsmind\.tc\.qq\.com url reject-200
^https?:\/\/pgdt\.ptengine\.cn url reject-200

; ====== 3. 微信小程序/公众号内的基础数据收集 ======
^https?:\/\/xcslite\.tencentcs\.com url reject-dict
^https?:\/\/badjs\.weixinbridge\.com url reject-200
^https?:\/\/mp\.weixin\.qq\.com\/mp\/waerrreport url reject-200

; ====== 4. 腾讯系其他常见弹窗与开屏广告 ======
^https?:\/\/(info4|info6|ios\.video\.mpush)\.video\.qq\.com url reject-200
^https?:\/\/(livep|vd|vi)\.l\.qq\.com url reject-200
