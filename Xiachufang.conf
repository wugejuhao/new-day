// ==UserScript==
// @ScriptName        下厨房纯净去广告与VIP点亮 [终极抓包版]
// @Author            @wugejuhao
// @Function          拦截穿山甲、友盟、个推、Vungle等底层广告 SDK，本地完美伪造 VIP 标识
// @UpdateTime        2026-10-23
// @Attention         请确保 QX 中 MitM 开关开启，并清除下厨房后台重进
// @Version           V1.1.0
// @ScriptURL         https://raw.githubusercontent.com/wugejuhao/new-day/refs/heads/main/Xiachufang.conf
// ==/UserScript==

hostname = api.xiachufang.com, trackbeat.xiachufang.com

# > 1. 深度广告联盟与统计埋点拦截 (底层 Reject，极致省电)
host-suffix, uyunad.com, reject
host-suffix, mosspf.net, reject
host-suffix, hookspf.com, reject
host-suffix, vungle.com, reject
host-suffix, doubleclick-cn.net, reject
host-suffix, app-ads-services.com, reject
host-suffix, gepush.com, reject
host-suffix, getui.com, reject
host-suffix, umeng.com, reject
host-keyword, uyunad, reject
host-keyword, umeng, reject

# > 2. 下厨房内部自建的开屏、活动与追踪请求 (伪装成功防死循环重试)
^https?:\/\/api\.xiachufang\.com\/v[0-9]+\/(ads|app_home|recommend_activities) url reject-200
^https?:\/\/api\.xiachufang\.com\/v[0-9]+\/ad\/lookup_(hybrid_)?ad url reject-200
^https?:\/\/trackbeat\.xiachufang\.com\/(sa|sa\.gif) url reject-200
^https?:\/\/track\.xiachufang\.com\/.* url reject-200

# > 3. 会员与个人核心鉴权解锁 (覆盖全部初始验证入口)
^https?:\/\/api\.xiachufang\.com\/v[0-9]+\/(account\/detail|account\/check_auth|user\/(get_profile|show))\.json url script-response-body https://raw.githubusercontent.com/wugejuhao/new-day/refs/heads/main/Xiachufang.js
