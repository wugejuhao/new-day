// ==UserScript==
// @ScriptName        下厨房极限去广告与完美VIP点亮
// @Author            @wugejuhao
// @Function          底层拦截所有广告联盟，纯文本替换解锁 VIP 和 Plus
// @UpdateTime        2026-10-23
// @Attention         请确保 QX 中 MitM 开关开启，并清除下厨房后台重进
// @Version           V1.2.0
// @ScriptURL         https://raw.githubusercontent.com/wugejuhao/new-day/refs/heads/main/Xiachufang.conf
// ==/UserScript==

hostname = api.xiachufang.com, trackbeat.xiachufang.com

# > 1. 广告联盟与追踪 SDK 域名黑名单 (底层断开，极致省电)
host-suffix, uyunad.com, reject
host-suffix, mosspf.net, reject
host-suffix, hookspf.com, reject
host-suffix, vungle.com, reject
host-suffix, doubleclick-cn.net, reject
host-suffix, doubleclick.net, reject
host-suffix, app-ads-services.com, reject
host-suffix, gepush.com, reject
host-suffix, getui.com, reject
host-suffix, umeng.com, reject
host-suffix, googleapis.com, reject
host-keyword, uyunad, reject
host-keyword, umeng, reject

# > 2. 下厨房内置开屏与推广活动 (伪装成功拦截)
^https?:\/\/api\.xiachufang\.com\/v[0-9]+\/(ads|app_home|recommend_activities) url reject-200
^https?:\/\/api\.xiachufang\.com\/v[0-9]+\/ad\/lookup_(hybrid_)?ad url reject-200
^https?:\/\/trackbeat\.xiachufang\.com\/(sa|sa\.gif) url reject-200
^https?:\/\/track\.xiachufang\.com\/.* url reject-200

# > 3. 会员 VIP 暴力解锁 (直接正则替换响应报文)
# 解锁 detail.json
^https?:\/\/api\.xiachufang\.com\/v[0-9]+\/account\/detail\.json url response-body "is_vip":\s*false response-body "is_vip":true
^https?:\/\/api\.xiachufang\.com\/v[0-9]+\/account\/detail\.json url response-body "is_plus":\s*false response-body "is_plus":true
^https?:\/\/api\.xiachufang\.com\/v[0-9]+\/account\/detail\.json url response-body "is_expert":\s*false response-body "is_expert":true

# 解锁 get_profile.json / show.json
^https?:\/\/api\.xiachufang\.com\/v[0-9]+\/user\/(get_profile|show)\.json url response-body "is_vip":\s*false response-body "is_vip":true
^https?:\/\/api\.xiachufang\.com\/v[0-9]+\/user\/(get_profile|show)\.json url response-body "is_plus":\s*false response-body "is_plus":true
^https?:\/\/api\.xiachufang\.com\/v[0-9]+\/user\/(get_profile|show)\.json url response-body "is_expert":\s*false response-body "is_expert":true

# 破解强制鉴权状态
^https?:\/\/api\.xiachufang\.com\/v[0-9]+\/account\/check_auth\.json url response-body "status":\s*[1-9] response-body "status":0
