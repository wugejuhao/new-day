name: Generate QX Icons
on:
  workflow_dispatch:

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Image Processing Library
        run: npm install sharp

      - name: Process SVGs to iOS 26 Liquid Glass
        run: |
          cat << 'EOF' > process.js
          const fs = require('fs');
          const path = require('path');
          const sharp = require('sharp');

          const inputDir = path.join(__dirname, 'flag-icons');
          const outputDir = path.join(__dirname, 'qx-icons');
          const repoUrlBase = 'https://raw.githubusercontent.com/wugejuhao/new-day/main/qx-icons';

          if (!fs.existsSync(outputDir)) {
              fs.mkdirSync(outputDir, { recursive: true });
          }

          const files = fs.readdirSync(inputDir).filter(f => f.endsWith('.svg'));
          const canvasSize = 144; // 最终输出 144x144

          let iconList = [];

          (async () => {
              for (const file of files) {
                  const name = path.parse(file).name;
                  const inputPath = path.join(inputDir, file);
                  const outputPath = path.join(outputDir, `${name}.png`);

                  try {
                      // 1. 等比缩放国旗（原比例最大化）
                      // 为了留出阴影空间，实际国旗最大占 132px，防止阴影被切边
                      const maxContent = 132;
                      const resizedBuffer = await sharp(inputPath)
                          .resize(maxContent, maxContent, { fit: 'inside' })
                          .png()
                          .toBuffer();
                      
                      const meta = await sharp(resizedBuffer).metadata();
                      const w = meta.width;
                      const h = meta.height;

                      // 2. iOS 26 超椭圆角比例 (30%)
                      const radius = Math.floor(Math.min(w, h) * 0.3);

                      // 3. 居中坐标
                      const x = Math.floor((canvasSize - w) / 2);
                      const y = Math.floor((canvasSize - h) / 2);

                      // 4. 创建 Liquid Glass 遮罩和内边缘
                      const maskSvg = Buffer.from(`
                          <svg width="${w}" height="${h}">
                              <rect x="0" y="0" width="${w}" height="${h}" rx="${radius}" ry="${radius}" fill="white" />
                          </svg>
                      `);

                      const glassBorderSvg = Buffer.from(`
                          <svg width="${w}" height="${h}">
                              <rect x="0.5" y="0.5" width="${w-1}" height="${h-1}" rx="${radius}" ry="${radius}" 
                                    fill="none" stroke="rgba(60,60,67,0.15)" stroke-width="1.2" />
                          </svg>
                      `);

                      // 5. 处理本体：将白色转为 #f2f2f7 (Apple 系统灰) 并套用圆角
                      const flagEntity = await sharp(resizedBuffer)
                          .flatten({ background: '#f2f2f7' }) // 解决白背景重叠问题
                          .composite([
                              { input: maskSvg, blend: 'dest-in' },
                              { input: glassBorderSvg, blend: 'over' }
                          ])
                          .png()
                          .toBuffer();

                      // 6. 创建 iOS 26 级液态投影 (Diffuse Shadow)
                      const shadowCanvas = Buffer.from(`
                          <svg width="${canvasSize}" height="${canvasSize}">
                              <defs>
                                  <filter id="liquidShadow" x="-50%" y="-50%" width="200%" height="200%">
                                      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/>
                                      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.1"/>
                                  </filter>
                              </defs>
                              <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${radius}" ry="${radius}" fill="black" filter="url(#liquidShadow)" />
                          </svg>
                      `);

                      // 7. 合成最终结果
                      await sharp(shadowCanvas)
                          .composite([{ input: flagEntity, left: x, top: y }])
                          .png()
                          .toFile(outputPath);

                      iconList.push({
                          name: name,
                          url: `${repoUrlBase}/${name}.png`
                      });

                      console.log(`已完成 iOS 26 风格处理: ${name}.png`);
                  } catch (e) {
                      console.error(`${name} 处理失败:`, e);
                  }
              }

              // 生成 JSON，链接严格使用 raw 格式
              const qxJson = {
                  name: "iOS 26 Liquid Glass Flags",
                  description: "适配 #feffff 背景的液态玻璃国旗图标库",
                  icons: iconList
              };

              fs.writeFileSync(path.join(outputDir, 'qx-icons.json'), JSON.stringify(qxJson, null, 2));
              console.log("JSON 已更新！");
          })();
          EOF
          node process.js

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add qx-icons/
          git commit -m "style: 升级至 iOS 26 液态玻璃风格 (适配 #feffff 背景)" || echo "无变动"
          git push
