name: Generate QX Icons
on:
  workflow_dispatch:

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Image Processing Library
        run: npm install sharp

      - name: Process SVGs to Liquid Glass Icons
        run: |
          cat << 'EOF' > process.js
          const fs = require('fs');
          const path = require('path');
          const sharp = require('sharp');

          const inputDir = path.join(__dirname, 'flag-icons');
          const outputDir = path.join(__dirname, 'qx-icons');
          const repoUrlBase = 'https://raw.githubusercontent.com/wugejuhao/new-day/main/qx-icons';

          if (!fs.existsSync(outputDir)) {
              fs.mkdirSync(outputDir, { recursive: true });
          }

          const files = fs.readdirSync(inputDir).filter(f => f.endsWith('.svg'));
          const size = 144;
          const maxFlagSize = 96; 

          let iconList = [];

          (async () => {
              for (const file of files) {
                  const name = path.parse(file).name;
                  const inputPath = path.join(inputDir, file);
                  const outputPath = path.join(outputDir, `${name}.png`);

                  try {
                      const resizedBuffer = await sharp(inputPath)
                          .resize(maxFlagSize, maxFlagSize, { fit: 'inside' })
                          .png()
                          .toBuffer();
                      
                      const meta = await sharp(resizedBuffer).metadata();
                      const w = meta.width;
                      const h = meta.height;

                      // 保持极具现代感的超椭圆角比例
                      const minEdge = Math.min(w, h);
                      const radius = Math.floor(minEdge * 0.3);

                      const x = Math.floor((size - w) / 2);
                      const y = Math.floor((size - h) / 2);

                      const maskSvg = Buffer.from(`
                          <svg width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg">
                              <rect x="0" y="0" width="${w}" height="${h}" rx="${radius}" ry="${radius}" fill="#FFFFFF" />
                          </svg>
                      `);

                      // 采用 ChatGPT 建议的 Liquid Glass 官方边框色：rgba(60,60,67,0.12)
                      const borderSvg = Buffer.from(`
                          <svg width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg">
                              <rect x="1" y="1" width="${w-2}" height="${h-2}" rx="${radius-1}" ry="${radius-1}" fill="none" stroke="rgba(60,60,67,0.12)" stroke-width="2" />
                          </svg>
                      `);

                      // 采用 ChatGPT 建议的苹果系统灰底色：#F2F2F7
                      const roundedFlag = await sharp(resizedBuffer)
                          .flatten({ background: '#F2F2F7' }) 
                          .composite([
                              { input: maskSvg, blend: 'dest-in' },
                              { input: borderSvg, blend: 'over' }
                          ])
                          .png()
                          .toBuffer();

                      // 柔和的弥散阴影，配合通透的玻璃质感
                      const shadowCanvas = Buffer.from(`
                          <svg width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg">
                              <defs>
                                  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
                                      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.15"/>
                                  </filter>
                              </defs>
                              <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${radius}" ry="${radius}" fill="#000000" filter="url(#shadow)" />
                          </svg>
                      `);

                      await sharp(shadowCanvas)
                          .composite([{ input: roundedFlag, left: x, top: y }])
                          .png()
                          .toFile(outputPath);

                      iconList.push({
                          name: name,
                          url: `${repoUrlBase}/${name}.png`
                      });

                      console.log(`已应用 iOS 26 Liquid Glass 风格: ${name}.png`);
                  } catch (e) {
                      console.error(`处理 ${name} 失败:`, e);
                  }
              }

              const qxJson = {
                  name: "Liquid Glass Icons",
                  description: "iOS 26 Liquid Glass 风格：#F2F2F7 苹果灰底色，极细通透边框",
                  icons: iconList
              };

              fs.writeFileSync(path.join(outputDir, 'qx-icons.json'), JSON.stringify(qxJson, null, 2));
              console.log("Liquid Glass 版图标库 JSON 已更新！");
          })();
          EOF
          node process.js

      - name: Commit and Push New Folder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add qx-icons/
          git commit -m "style: 更新为 iOS 26 Liquid Glass 风格 (#F2F2F7 底色 + 官方透明边框)" || echo "No changes to commit"
          git push
