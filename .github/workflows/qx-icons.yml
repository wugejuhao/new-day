name: Generate QX Icons
on:
  workflow_dispatch:

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Image Processing Library
        run: npm install sharp

      - name: Process SVGs to 144px Liquid Glass Icons
        run: |
          cat << 'EOF' > process.js
          const fs = require('fs');
          const path = require('path');
          const sharp = require('sharp');

          const inputDir = path.join(__dirname, 'flag-icons');
          const outputDir = path.join(__dirname, 'qx-icons');
          const repoUrlBase = 'https://raw.githubusercontent.com/wugejuhao/new-day/main/qx-icons';

          if (!fs.existsSync(outputDir)) {
              fs.mkdirSync(outputDir, { recursive: true });
          }

          const files = fs.readdirSync(inputDir).filter(f => f.endsWith('.svg'));
          const canvasSize = 144; 

          let iconList = [];

          (async () => {
              for (const file of files) {
                  const name = path.parse(file).name;
                  const inputPath = path.join(inputDir, file);
                  const outputPath = path.join(outputDir, `${name}.png`);

                  try {
                      // 1. 最大化撑满 144 像素，原比例不变
                      const maxContent = 144;
                      const resizedBuffer = await sharp(inputPath)
                          .resize(maxContent, maxContent, { fit: 'inside' })
                          .png()
                          .toBuffer();
                      
                      const meta = await sharp(resizedBuffer).metadata();
                      const w = meta.width;
                      const h = meta.height;

                      // 2. iOS 26 超椭圆角比例 (30%)
                      const radius = Math.floor(Math.min(w, h) * 0.3);

                      // 3. 相对 144x144 画布的居中坐标 (比如国旗高度只有 96，那上下各留白 24)
                      const x = Math.floor((canvasSize - w) / 2);
                      const y = Math.floor((canvasSize - h) / 2);

                      // 4. 创建 Liquid Glass 内部光影层 (光泽 + 内阴影)
                      const glassOverlaySvg = Buffer.from(`
                          <svg width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg">
                              <defs>
                                  <linearGradient id="glassLighting" x1="0%" y1="0%" x2="0%" y2="100%">
                                      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
                                      <stop offset="15%" stop-color="#ffffff" stop-opacity="0.1"/>
                                      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
                                      <stop offset="85%" stop-color="#000000" stop-opacity="0.1"/>
                                      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
                                  </linearGradient>
                              </defs>
                              
                              <rect x="0" y="0" width="${w}" height="${h}" rx="${radius}" ry="${radius}" fill="url(#glassLighting)" />
                              
                              <rect x="0" y="0" width="${w}" height="${h}" rx="${radius}" ry="${radius}" fill="none" stroke="#000000" stroke-width="4" filter="blur(2px)" opacity="0.25" />
                              
                              <rect x="0.5" y="0.5" width="${w-1}" height="${h-1}" rx="${radius}" ry="${radius}" fill="none" stroke="rgba(60,60,67,0.15)" stroke-width="1.2" />
                          </svg>
                      `);

                      // 5. 创建裁切遮罩
                      const maskSvg = Buffer.from(`
                          <svg width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg">
                              <rect x="0" y="0" width="${w}" height="${h}" rx="${radius}" ry="${radius}" fill="white" />
                          </svg>
                      `);

                      // 6. 处理国旗本体：垫上 #f2f2f7 灰白底，加上内部光影，并精细裁切圆角
                      const flagEntity = await sharp(resizedBuffer)
                          .flatten({ background: '#f2f2f7' }) // 苹果 SystemGray 6，完美适配你的 #feffff 背景
                          .composite([
                              { input: glassOverlaySvg, blend: 'over' }, // 加上光影和内阴影
                              { input: maskSvg, blend: 'dest-in' }       // 裁出超椭圆倒角
                          ])
                          .png()
                          .toBuffer();

                      // 7. 将处理好的国旗直接贴在一张纯透明的 144x144 画布中心
                      await sharp({
                          create: {
                              width: canvasSize,
                              height: canvasSize,
                              channels: 4,
                              background: { r: 0, g: 0, b: 0, alpha: 0 }
                          }
                      })
                      .composite([{ input: flagEntity, left: x, top: y }])
                      .png()
                      .toFile(outputPath);

                      iconList.push({
                          name: name,
                          url: `${repoUrlBase}/${name}.png`
                      });

                      console.log(`完成 144px 满格内阴影渲染: ${name}.png`);
                  } catch (e) {
                      console.error(`${name} 处理失败:`, e);
                  }
              }

              const qxJson = {
                  name: "iOS 26 Liquid Glass Max",
                  description: "144px 满格液态玻璃国旗图标库，带精美内透视阴影",
                  icons: iconList
              };

              fs.writeFileSync(path.join(outputDir, 'qx-icons.json'), JSON.stringify(qxJson, null, 2));
              console.log("JSON 订阅已更新！");
          })();
          EOF
          node process.js

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add qx-icons/
          git commit -m "style: 升级至 144px 满格 Liquid Glass，采用内阴影体积光" || echo "无变动"
          git push
