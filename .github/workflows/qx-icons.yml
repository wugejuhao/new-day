name: Generate QX Icons
on:
  workflow_dispatch: # 允许在网页端手动触发运行

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予写入仓库并创建新文件夹的权限
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Image Processing Library
        run: npm install sharp

      - name: Process SVGs to Rounded PNGs
        run: |
          cat << 'EOF' > process.js
          const fs = require('fs');
          const path = require('path');
          const sharp = require('sharp');

          const inputDir = path.join(__dirname, 'flag-icons');
          const outputDir = path.join(__dirname, 'qx-icons'); // 自动生成的全新文件夹
          const repoUrlBase = 'https://raw.githubusercontent.com/wugejuhao/new-day/main/qx-icons';

          // 如果新文件夹不存在，自动创建
          if (!fs.existsSync(outputDir)) {
              fs.mkdirSync(outputDir, { recursive: true });
          }

          const files = fs.readdirSync(inputDir).filter(f => f.endsWith('.svg'));
          const size = 144;
          const radius = 32; // 圆角半径，类似于 iOS 图标的视觉比例

          let qxJson = {}; // 存放生成的 JSON 字典

          // 利用 SVG 绘制一个用于倒圆角的遮罩
          const roundedCorners = Buffer.from(
              `<svg><rect x="0" y="0" width="${size}" height="${size}" rx="${radius}" ry="${radius}"/></svg>`
          );

          (async () => {
              for (const file of files) {
                  const name = path.parse(file).name;
                  const inputPath = path.join(inputDir, file);
                  const outputPath = path.join(outputDir, `${name}.png`);

                  try {
                      await sharp(inputPath)
                          .resize(size, size, { fit: 'cover' }) // 'cover' 保证国旗尽可能占满 144x144，自动裁切溢出部分
                          .composite([{ input: roundedCorners, blend: 'dest-in' }]) // 应用圆角遮罩，外部变透明
                          .png()
                          .toFile(outputPath);

                      // 将生成的 Raw 链接写入 JSON 对象
                      qxJson[name] = `${repoUrlBase}/${name}.png`;
                      console.log(`成功处理: ${name}.png`);
                  } catch (e) {
                      console.error(`处理 ${name} 失败:`, e);
                  }
              }

              // 将最终的 JSON 输出到新文件夹中
              fs.writeFileSync(path.join(outputDir, 'qx-icons.json'), JSON.stringify(qxJson, null, 2));
              console.log("图标库 JSON 已生成！");
          })();
          EOF
          node process.js

      - name: Commit and Push New Folder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add qx-icons/
          git commit -m "feat: Auto-generate 144x144 rounded PNG icons for Quantumult X" || echo "No changes to commit"
          git push
