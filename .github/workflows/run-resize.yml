name: Auto Resize Icons

on:
  workflow_dispatch: # 允许你在网页上手动点击运行

jobs:
  process-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予服务器保存新图片的权限

    steps:
      - name: 1. 拉取你的仓库代码
        uses: actions/checkout@v3

      - name: 2. 安装 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. 安装图像处理库
        run: pip install Pillow

      - name: 4. 运行你写的图片缩放脚本
        run: |
          cd icon/flag
          python resize.py

      - name: 5. 自动将处理好的正方形图标保存并推送到仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add icon/flag/*.png
          git commit -m "Auto resize flag icons to standard 144x144" || echo "No changes to commit"
          git push
