#!name=狂野飙车 9 (Asphalt 9) 看广告领金币加速·省电实验版 (Mode 2)
#!desc=保留主动看广告领双倍金币/卡包/补油功能；剥离所有被动弹窗/赛道3D广告牌/500+次高频遥测；将AppLovin/AdMob几兆~十几兆广告视频直接302重定向为6KB的0.1秒极短空白视频，将4.7MB互动试玩小游戏替换为1KB秒完成卡片。
#!author=wugejuhao

# =========================================
# 1. 分流与底层拦截部分 (单文件引用直接生效)
# =========================================

# > 强制放行 Gameloft 核心鉴权、联机测速、内购、热更资源库与数据湖
host-keyword, agones-udp-ping, World
host, gdid.datalake.gameloft.com, World
host, sink.gameloft.com, World
host, eve.gameloft.com, World
host-suffix, gold0028.gameloft.com, World
host-suffix, iris16-gold.gameloft.com, World
host-suffix, iris07-gold-ssl.gameloft.com, World

# > 强制放行看广告领金币 S2S 服务端签名回调必需的核心域名 (保证 Seshat 校验 100% 通过拿到金币)
host-suffix, mediation.unity3d.com, World
host-suffix, iads.unity3d.com, World
host-suffix, applovin.com, World
host-suffix, applvn.com, World
host-suffix, googlesyndication.com, World
host-suffix, doubleclick.net, World
host-suffix, googlevideo.com, World

# > [核心省电] Gameloft 高频连接状态遥测与二进制埋点 (底层直接拒绝，0 解密损耗，省下每局 524 次 POST)
host-wildcard, asphalt-*-ingestor.gold*.gameloft.com, reject
host, asphalt-oct-ingestor.gold0028.gameloft.com, reject
host, etsv2.datalake.gameloft.com, reject
host, etsv2.gameloft.org, reject
host, o92387.ingest.sentry.io, reject

# > [精准去冗余广告/防追踪耗电] 拦截与领金币无关的积分墙、赛道 3D 广告牌及统计打点
host, odm.app-ads-services.com, reject
host-suffix, app-analytics-services.com, reject
host-suffix, singular.net, reject
host-suffix, appsflyer.com, reject
host-suffix, appsflyersdk.com, reject
host, sts.applovin.com, reject
host-suffix, offerwall.unity3d.com, reject
host, ae.iads.unity3d.com, reject
host-suffix, inner-active.mobi, reject
host-suffix, fyber.com, reject

# =========================================
# 2. 激励广告 0.1 秒视频替换与被动广告剥离重写部分
# =========================================

# > 1. 剥离 Gameloft 被动插屏/横幅广告位，仅保留主动看广告领金币/卡包/补油 (_IV / race_reward) 点位
^https?:\/\/a314\.gameloft\.com\/un\/index\.hhh\?event=init url script-response-body https://raw.githubusercontent.com/wugejuhao/new-day/main/Asphalt9_AdReward.js

# > 2. 拦截 Gameloft 内部交叉推广弹窗与赛道内 Anzu 3D 广告牌
^https?:\/\/201205igp\.gameloft\.com\/ url reject-200
^https?:\/\/l1-1\.anzu\.io\/ url reject-dict
^https?:\/\/logic\.anzuinfra\.com\/ url reject-200
^https?:\/\/(events|gateway)\.prod\.anzu-us\.com\/ url reject-200

# > 3. 欺骗 Axon / AppLovin 行为追踪接口 (返回 200 空响应，消除 ms.applovin.com/1.0/sdk/error 报错重发，同时省去 64 次连接开销)
^https?:\/\/prod-e\d*\.axon\.ai\/1\.0\/event\/ url reject-200
^https?:\/\/rt\.applovin\.com\/4\.0\/pix url reject-200
^https?:\/\/rt\.applvn\.com\/4\.0\/pix url reject-200

# > 4. [核心秒跳过 1] 将 AppLovin 与 AdMob 原生播放器请求的所有 .mp4 广告视频 (6MB~18MB，30~60秒)
#    直接 302 重定向到仓库内同编码的 6KB (0.1秒) 极短空白视频！原生 AVPlayer 加载后 0.1 秒即触发真实完播回调！
^https?:\/\/res\d*\.applovin\.com\/.*\.mp4 url 302 https://raw.githubusercontent.com/wugejuhao/new-day/main/blank.mp4
^https?:\/\/res\d*\.applvn\.com\/.*\.mp4 url 302 https://raw.githubusercontent.com/wugejuhao/new-day/main/blank.mp4
^https?:\/\/rr\d+---sn-[a-z0-9-]+\.googlevideo\.com\/videoplayback url 302 https://raw.githubusercontent.com/wugejuhao/new-day/main/blank.mp4
^https?:\/\/redirector\.googlevideo\.com\/videoplayback url 302 https://raw.githubusercontent.com/wugejuhao/new-day/main/blank.mp4

# > 5. [核心秒跳过 2] 将 AppLovin 4.7MB 漫长的互动试玩小游戏 / 视频尾帧页 (_js_load.js) 替换为 1KB 秒完成卡片
^https?:\/\/res\d*\.applovin\.com\/.*_js_load\.js url script-response-body https://raw.githubusercontent.com/wugejuhao/new-day/main/Asphalt9_AdReward.js
^https?:\/\/res\d*\.applvn\.com\/.*_js_load\.js url script-response-body https://raw.githubusercontent.com/wugejuhao/new-day/main/Asphalt9_AdReward.js

# > 6. [核心秒跳过 3] 将 Google AdMob 激励视频广告注入 16 倍速自动快进完播脚本并缩短 60 秒强制倒计时
^https?:\/\/googleads\.g\.doubleclick\.net\/cads\/fetch\/gbid_sdk url script-response-body https://raw.githubusercontent.com/wugejuhao/new-day/main/Asphalt9_AdReward.js

hostname = a314.gameloft.com, 201205igp.gameloft.com, l1-1.anzu.io, logic.anzuinfra.com, events.prod.anzu-us.com, gateway.prod.anzu-us.com, res*.applovin.com, res*.applvn.com, prod-e*.axon.ai, rt.applovin.com, rt.applvn.com, googleads.g.doubleclick.net, *.googlevideo.com
