host-suffix, applvn.com, reject
host-suffix, axon.ai, reject

# > [核心省电] Gameloft 高频连接状态遥测、二进制埋点、错误监控与 Anzu 赛道广告牌 (全部底层直接拒绝，0 MitM 解密损耗)
