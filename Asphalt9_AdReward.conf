# > 强制放行 Gameloft 核心鉴权、联机测速、内购、热更资源库与数据湖
host-keyword, agones-udp-ping, World
host, gdid.datalake.gameloft.com, World
host, sink.gameloft.com, World
host, eve.gameloft.com, World
host-suffix, gold0028.gameloft.com, World
host-suffix, iris16-gold.gameloft.com, World
host-suffix, iris07-gold-ssl.gameloft.com, World

# > 强制放行 Unity LevelPlay 聚合器、Google AdMob 激励通道与 jsDelivr 空白视频 CDN
