# =========================================
# 2. 双通道 1 秒全自动领奖 + 去游戏内推销大弹窗重写部分
# =========================================

# > 1. Gameloft 广告位总控 + 自家备用激励视频 (loc_video) 双保险 1 秒秒领
#    - event=init：剥离被动插屏/横幅，仅保留主动领金币/卡包/补油点位
#    - location=loc_video：将 15 秒 Gameloft 自家推广视频替换为 0.1 秒 blank.mp4 并自动领奖关窗
^https?:\/\/a314\.gameloft\.com\/un\/index\.hhh url script-response-body https://raw.githubusercontent.com/wugejuhao/new-day/main/Asphalt9_AdReward.js

# > 2. 拦截 Gameloft 内部交叉推广弹窗 & 每局回大厅重复下载 2.75MB 的商城/活动推广大弹窗 (PPMT_A9_IG_*)
#    (精准只拦 PPMT_A9_IG_ 推广包，完全放行 dlcs_*.json / behavioral_*.json 等热更核心数据)
^https?:\/\/201205igp\.gameloft\.com\/ url reject-200
^https?:\/\/iris16-gold\.gameloft\.com\/asphalt\/PPMT_A9_IG_ url reject

# > 3. [核心秒跳过 1] 将 AdMob 激励视频请求的所有 .mp4 广告视频 (8MB~18MB，30~60秒)
#    通过 jsDelivr CDN 302 重定向到 6KB (0.1秒) 极短空白视频 (HTTP 206 + Content-Type: video/mp4，永久本地复用)
^https?:\/\/rr\d+---sn-[a-z0-9-]+\.googlevideo\.com\/videoplayback.* url 302 https://cdn.jsdelivr.net/gh/wugejuhao/new-day@main/blank.mp4
^https?:\/\/redirector\.googlevideo\.com\/videoplayback.* url 302 https://cdn.jsdelivr.net/gh/wugejuhao/new-day@main/blank.mp4

# > 4. [核心秒跳过 2] 改写 Google AdMob 激励广告 HTML：清洗坏缓存键 + 纯黑遮罩 + 屏蔽 App Store 弹窗 (SKSPVC)，onshow 后 0.25秒发奖、0.6秒自动关窗！
^https?:\/\/googleads\.g\.doubleclick\.net\/cads\/fetch\/gbid_sdk url script-response-body https://raw.githubusercontent.com/wugejuhao/new-day/main/Asphalt9_AdReward.js

# > 全游戏仅 MitM 5 个低频必要域名，最大化省电！
