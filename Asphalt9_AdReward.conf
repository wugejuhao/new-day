# =========================================
# 2. 激励广告 1 秒全自动领奖 + 自动关闭重写部分
# =========================================

# > 1. 剥离 Gameloft 被动插屏/横幅广告位，仅保留主动看广告领金币/卡包/补油 (_IV / race_reward) 点位
^https?:\/\/a314\.gameloft\.com\/un\/index\.hhh\?event=init url script-response-body https://raw.githubusercontent.com/wugejuhao/new-day/main/Asphalt9_AdReward.js

# > 2. 拦截 Gameloft 内部交叉推广弹窗与赛道内 Anzu 3D 广告牌
^https?:\/\/201205igp\.gameloft\.com\/ url reject-200
^https?:\/\/l1-1\.anzu\.io\/ url reject-dict
^https?:\/\/logic\.anzuinfra\.com\/ url reject-200
^https?:\/\/(events|gateway)\.prod\.anzu-us\.com\/ url reject-200

# > 3. [核心秒跳过 1] 将 AdMob 激励视频请求的所有 .mp4 广告视频 (8MB~18MB，30~60秒)
#    通过 jsDelivr CDN 302 重定向到 6KB (0.1秒) 极短空白视频！
#    (关键修复：jsDelivr 返回标准 Content-Type: video/mp4 + HTTP 206 Range，彻底解决 raw.githubusercontent.com 返回 application/octet-stream 导致 iOS AVPlayer 报 videoplayfailed400 的问题！)
^https?:\/\/rr\d+---sn-[a-z0-9-]+\.googlevideo\.com\/videoplayback.* url 302 https://cdn.jsdelivr.net/gh/wugejuhao/new-day@main/blank.mp4
^https?:\/\/redirector\.googlevideo\.com\/videoplayback.* url 302 https://cdn.jsdelivr.net/gh/wugejuhao/new-day@main/blank.mp4

# > 4. [核心秒跳过 2] 改写 Google AdMob 激励广告 HTML：保留预加载超时不误杀，纯黑遮罩无画面，监听 onshow 0.35秒自动触发原生 grantReward 发双倍金币，1秒自动关闭窗口！
^https?:\/\/googleads\.g\.doubleclick\.net\/cads\/fetch\/gbid_sdk url script-response-body https://raw.githubusercontent.com/wugejuhao/new-day/main/Asphalt9_AdReward.js

hostname = a314.gameloft.com, 201205igp.gameloft.com, l1-1.anzu.io, logic.anzuinfra.com, events.prod.anzu-us.com, gateway.prod.anzu-us.com, googleads.g.doubleclick.net, *.googlevideo.com
