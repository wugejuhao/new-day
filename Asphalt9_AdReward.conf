# =========================================
# 2. 激励广告 1.2 秒全自动领双倍金币 + 自动关闭重写部分
# =========================================

# > 1. 剥离 Gameloft 被动插屏/横幅广告位，仅保留主动看广告领双倍金币/卡包/补油 (_IV / race_reward) 点位
^https?:\/\/a314\.gameloft\.com\/un\/index\.hhh\?event=init url script-response-body https://raw.githubusercontent.com/wugejuhao/new-day/main/Asphalt9_AdReward.js

# > 2. 拦截 Gameloft 内部交叉推广弹窗 (轻量返回 200 防止重试)
^https?:\/\/201205igp\.gameloft\.com\/ url reject-200

# > 3. [核心秒跳过 1] 将 AdMob 激励视频请求的所有 .mp4 广告视频 (8MB~18MB，30~60秒)
#    通过 jsDelivr CDN 302 重定向到 6KB (0.1秒) 极短空白视频 (HTTP 206 + Content-Type: video/mp4，iOS AVPlayer 100% 兼容)
^https?:\/\/rr\d+---sn-[a-z0-9-]+\.googlevideo\.com\/videoplayback.* url 302 https://cdn.jsdelivr.net/gh/wugejuhao/new-day@main/blank.mp4
^https?:\/\/redirector\.googlevideo\.com\/videoplayback.* url 302 https://cdn.jsdelivr.net/gh/wugejuhao/new-day@main/blank.mp4

# > 4. [核心秒跳过 2] 改写 Google AdMob 激励广告 HTML：纯黑遮罩无画面 + 屏蔽 App Store 弹窗 (SKSPVC)，onshow 后 0.25秒发双倍金币、0.6秒自动关窗！
^https?:\/\/googleads\.g\.doubleclick\.net\/cads\/fetch\/gbid_sdk url script-response-body https://raw.githubusercontent.com/wugejuhao/new-day/main/Asphalt9_AdReward.js

# > 全游戏仅 MitM 4 个必要域名，最大化省电！
hostname = a314.gameloft.com, 201205igp.gameloft.com, googleads.g.doubleclick.net, *.googlevideo.com
