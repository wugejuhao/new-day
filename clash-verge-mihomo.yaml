# Clash Verge Configuration - mihomo Latest Syntax
# Updated: 2026-06-06
# 快速稳定优化版本 - 已修复节点连接问题

port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
allow-lan: false
bind-address: '*'
mode: rule
log-level: info
ipv6: true
unified-delay: true
tcp-concurrent: true
keep-alive-interval: 30
external-controller: 127.0.0.1:9090
external-ui: ui

# ========== 代理订阅 ==========
proxy-providers:
  JMS:
    type: http
    url: https://jjsubmarines.com/members/getsub.php?service=1323149&id=9d42fe99-4719-4a7d-97c2-e52ed494e5b2&usedomains=1
    interval: 300
    path: ./providers/jms.yaml
    health-check:
      enable: true
      interval: 300
      url: http://cp.cloudflare.com/
      timeout: 5000

  自建US:
    type: http
    url: https://door.onijia.net:2096/subb/hkmysa83889kbhi5
    interval: 300
    path: ./providers/zijian-us.yaml
    health-check:
      enable: true
      interval: 300
      url: http://cp.cloudflare.com/
      timeout: 5000

