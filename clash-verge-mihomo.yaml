# ========== DNS配置 ==========
dns:
  enable: true
  listen: 0.0.0.0:53
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.test'
  
  nameserver:
    - '1.1.1.1'        # Cloudflare
    - '1.0.0.1'        # Cloudflare Secondary
    - '8.8.8.8'        # Google
    - '8.8.4.4'        # Google Secondary
    - '2606:4700:4700::1111'  # Cloudflare IPv6
    - '2606:4700:4700::1001'  # Cloudflare IPv6 Secondary

  fallback:
    - 'tcp://1.1.1.1:53'
    - 'tcp://8.8.8.8:53'

  fallback-filter:
    geoip: true
    geoipcode: CN
    ipcidr:
      - '240.0.0.0/4'

# ========== 规则 ==========
