# ========== DNS配置 ==========
dns:
  enable: true
  listen: 0.0.0.0:53
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  nameserver:
    - 1.1.1.1
    - 8.8.8.8
    - 8.8.4.4
  fallback:
    - tcp://1.1.1.1:53
    - tcp://8.8.8.8:53
  fallback-filter:
    geoip: true
    geoipcode: CN
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/32
    domain:
      - +.google.com
      - +.facebook.com

# ========== 规则 ==========
rules:
  # 特定IP直连
  - IP-CIDR,65.181.176.232/32,DIRECT

  # Netflix
  - DOMAIN-SUFFIX,netflix.com,🎬 Netflix
  - DOMAIN-SUFFIX,nflximg.net,🎬 Netflix
  - DOMAIN-SUFFIX,nflxvideo.net,🎬 Netflix
  - DOMAIN-SUFFIX,nflxext.com,🎬 Netflix

  # Disney+
  - DOMAIN-SUFFIX,disneyplus.com,🎥 Disney+
  - DOMAIN-SUFFIX,disney.com,🎥 Disney+
  - DOMAIN-SUFFIX,dssott.com,🎥 Disney+

  # HBO Max
