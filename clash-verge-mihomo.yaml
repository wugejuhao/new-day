# Clash Verge Configuration - Based on mihomo latest syntax
# 配置最后更新时间: 2026-06-06
# 快速稳定优化版本

mixed-port: 7890
allow-lan: false
bind-address: '*'
mode: rule
log-level: info
ipv6: true
unified-delay: true
tcp-concurrent: true
external-controller: 127.0.0.1:9090
external-ui: ui

# ========== 代理订阅 ==========
proxy-providers:
  JMS:
    type: http
    url: https://jjsubmarines.com/members/getsub.php?service=1323149&id=9d42fe99-4719-4a7d-97c2-e52ed494e5b2&usedomains=1
    interval: 300
    path: ./providers/jms.yaml
    health-check:
      enable: true
      interval: 300
      url: http://www.gstatic.com/generate_204

  自建US:
    type: http
    url: https://door.onijia.net:2096/subb/hkmysa83889kbhi5
    interval: 300
    path: ./providers/zijian-us.yaml
    health-check:
      enable: true
      interval: 300
      url: http://www.gstatic.com/generate_204

# ========== 直连IP ==========
proxy-groups:
  - name: 🔗 直连IP
    type: select
    proxies:
      - DIRECT
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Direct.png

# ========== 节点选择 ==========
  - name: 🚀 手动选择
    type: select
    use:
      - JMS
      - 自建US
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Rocket.png

  - name: 🌍 全球优选
    type: url-test
    use:
      - JMS
      - 自建US
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Global.png

  - name: 🎯 自动选择
    type: fallback
    use:
      - JMS
      - 自建US
    url: http://www.gstatic.com/generate_204
    interval: 300
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Auto.png

