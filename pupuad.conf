#!name=朴朴超市
#!desc=朴朴超市去广告，默认接管模式可用版 (Quantumult X 适配版)
#!author=wugejuhao

[filter_local]
# 拦截 HTTPDNS 对应的特定 IP，防止 App 绕过代理
ip-cidr, 139.196.12.179/32, reject
ip-cidr, 106.55.220.18/32, reject
ip-cidr, 54.222.159.138/32, reject
ip-cidr, 101.42.130.147/32, reject

[rewrite_local]
# --- URL Rewrite ---
# 直接丢弃 HTTPDNS 解析请求
^http:\/\/139\.196\.12\.179:8053\/httpdns\/ url reject
^http:\/\/106\.55\.220\.18:8053\/httpdns\/ url reject
^http:\/\/54\.222\.159\.138:8053\/httpdns\/ url reject
^http:\/\/101\.42\.130\.147\/httpdns\/resolve\/ url reject
#^https:\/\/j1\.pupuapi\.com\/client\/member_card\/index\/my url reject

# --- Map Local (转换为 reject-dict) ---
# QX 中的 reject-dict 会直接返回 HTTP 200 且 Body 为 "{}"，完美等效于原规则的 Map Local 空字典
^https:\/\/j1\.pupuapi\.com\/client\/marketing\/advertisement\/search_input_ranking url reject-dict
^https:\/\/j1\.pupuapi\.com\/client\/assets\/discount\/order url reject-dict
^https:\/\/j1\.pupuapi\.com\/client\/marketing\/channel\/global_redeem\/top_tip\/v2 url reject-dict
^https:\/\/j1\.pupuapi\.com\/client\/recommendation\/hub\/interests\/products\/v2 url reject-dict
^https:\/\/j1\.pupuapi\.com\/client\/member_card\/premium\/user_center url reject-dict

# --- Body Rewrite ---
# 原规则使用 jq 修改 body 为 '.data = []'。在 QX 中，使用 reject-dict 返回空对象 {} 同样可以达到消除红点/未读消息面板的效果，且不会引发报错。
^https:\/\/j1\.pupuapi\.com\/client\/notification\/message_center\/unread_number url reject-dict

# --- Script (执行远端去广告脚本) ---
# 调用 fmz200 仓库的核心 JS 剔除数据流内的广告元素
^https:\/\/j1\.pupuapi\.com\/client\/search\/hot_keywords\/v3 url script-response-body https:\/\/raw.githubusercontent.com\/fmz200\/wool_scripts\/main\/Scripts\/PupuSplashAds.js
^https:\/\/j1\.pupuapi\.com\/client\/marketing\/advertisement\/v1 url script-response-body https:\/\/raw.githubusercontent.com\/fmz200\/wool_scripts\/main\/Scripts\/PupuSplashAds.js
^https:\/\/j1\.pupuapi\.com\/client\/search\/hub\/search_box\/products\/v6 url script-response-body https:\/\/raw.githubusercontent.com\/fmz200\/wool_scripts\/main\/Scripts\/PupuSplashAds.js
^https:\/\/j1\.pupuapi\.com\/client\/order_settlement\/detail url script-response-body https:\/\/raw.githubusercontent.com\/fmz200\/wool_scripts\/main\/Scripts\/PupuSplashAds.js
^https:\/\/j1\.pupuapi\.com\/client\/order\/orders\/list\/v4 url script-response-body https:\/\/raw.githubusercontent.com\/fmz200\/wool_scripts\/main\/Scripts\/PupuSplashAds.js

[mitm]
hostname = j1.pupuapi.com