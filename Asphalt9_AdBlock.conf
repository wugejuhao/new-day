#!name=狂野飙车 9 (Asphalt 9) 极省电纯净规则
#!desc=伪造游戏内广告API防重试耗电，底层秒切AppLovin/Unity几十兆视频广告预加载，并修复多人联机UDP测速。
#!author=wugejuhao

# =========================================
# 1. 分流与底层拦截部分 (供 [filter_remote] 读取)
# =========================================

# > 修复多人联机延迟测速 (绕过不支持 UDP 的代理节点，直接测试真实延迟)
host-keyword, agones-udp-ping, World

# > 强制放行 Gameloft 核心鉴权、内购与数据湖 (防断网转圈)
host, gdid.datalake.gameloft.com, World
host, etsv2.datalake.gameloft.com, World
host, sink.gameloft.com, World
host, eve.gameloft.com, World
host-suffix, gold0028.gameloft.com, World

# > 第三方视频广告与积分墙 SDK (底层直接拒绝，零解密损耗，防偷跑流量)
host, odm.app-ads-services.com, reject
host-suffix, applovin.com, reject
host-suffix, applvn.com, reject
host-suffix, mediation.unity3d.com, reject
host-suffix, offerwall.unity3d.com, reject
host-suffix, iads.unity3d.com, reject
host-suffix, inner-active.mobi, reject
host-suffix, fyber.com, reject
host-suffix, supersonicads.com, reject
host-suffix, ironsrc.com, reject
host-suffix, googlesyndication.com, reject
host-suffix, googletagservices.com, reject
host-suffix, doubleclick.net, reject

# > 游戏内错误监控与性能追踪上报 (直接阻断省电)
host-suffix, sentry.io, reject
host-suffix, newrelic.com, reject
host-suffix, nr-data.net, reject


# =========================================
# 2. 内部广告 API 欺骗部分 (供 [rewrite_remote] 读取)
# =========================================

# > Gameloft 内部交叉推广与弹窗 (返回 200 假装成功，防死循环重试)
^https?:\/\/a314\.gameloft\.com\/ url reject-200
^https?:\/\/201205igp\.gameloft\.com\/ url reject-200

# > Anzu 游戏赛道内 3D 广告牌 (返回空数据，赛道广告牌将保持干净默认涂装)
^https?:\/\/l1-1\.anzu\.io\/ url reject-dict
^https?:\/\/logic\.anzuinfra\.com\/ url reject-200
^https?:\/\/(events|gateway)\.prod\.anzu-us\.com\/ url reject-200

# > 仅对这 6 个必须欺骗的轻量域名开启 MitM 解密，最大化节省手机电量
hostname = a314.gameloft.com, 201205igp.gameloft.com, l1-1.anzu.io, logic.anzuinfra.com, events.prod.anzu-us.com, gateway.prod.anzu-us.com
